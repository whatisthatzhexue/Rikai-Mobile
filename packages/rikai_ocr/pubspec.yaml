name: rikai_ocr
description: Offline Japanese OCR plugin for Rikai-Mobile (PaddleOCR PP-OCRv5 + MangaOCR via ONNX Runtime).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rikai.ocr
        pluginClass: RikaiOcrPlugin
